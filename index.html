<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Neon Horizon</title>
<style>
:root{--bg:#050505;--fg:#fff;--ac:#00f2fe;--ac2:#4facfe}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Segoe UI',Tahoma,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100}
#menu{background:radial-gradient(circle,#161616,#000)}
#lobby{background:rgba(0,0,0,.3)}
#result{background:rgba(0,0,0,.85)}
h1{font-size:3.2rem;letter-spacing:5px;text-transform:uppercase;margin:0 0 6px;text-shadow:0 5px 15px rgba(0,242,254,.5);text-align:center}
h2{color:#aaa;font-weight:300;letter-spacing:2px;margin:0 0 18px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:10px 20px;max-width:900px;width:100%}
.btn{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);color:#fff;padding:12px 16px;font-size:1rem;font-weight:700;cursor:pointer;border-radius:8px;text-transform:uppercase}
.btn:hover{background:rgba(255,255,255,.3)}
.btn:active{background:var(--ac);color:#000}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.on{background:rgba(0,255,100,.25);border-color:#0f6}
.sm{padding:7px 12px;font-size:.85rem}
#err{color:#f55;margin-top:14px;text-align:center;max-width:80%}
.box{display:flex;flex-direction:column;width:95%;max-width:1200px;height:82%}
.hd{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:rgba(0,0,0,.85);border-radius:12px 12px 0 0;border-bottom:2px solid var(--ac)}
.hd b{color:var(--ac2);font-size:1.8rem}
.ct{display:flex;flex:1;gap:16px;margin-top:12px;min-height:0;padding-bottom:84px}
.vp{flex:2}
.pn{flex:1.4;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-right:6px}
.sec{background:rgba(0,0,0,.8);padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.2)}
.sec h3{margin:0 0 10px;font-size:1rem;border-bottom:1px solid var(--ac2);padding-bottom:5px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
.bar{width:100px;height:7px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ac2);border-radius:4px}
input[type=color]{width:42px;height:38px;border:2px solid #fff;border-radius:6px;padding:0;background:none}
.fx{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9999;padding:14px 26px;font-size:1.2rem;font-weight:900;border-radius:8px;cursor:pointer;text-transform:uppercase}
#back{left:16px;background:#333;color:#fff;border:2px solid #666}
#go{right:16px;border:0;background:linear-gradient(45deg,var(--ac),var(--ac2));color:#000;box-shadow:0 0 20px rgba(0,242,254,.7)}
#hud{position:absolute;inset:0;z-index:50;pointer-events:none}
#info{position:absolute;top:24px;left:30px;font-size:1.2rem;font-weight:600;text-shadow:0 2px 5px #000}
#pos{font-size:3rem;font-weight:900}
#spd{position:absolute;bottom:36px;right:36px;text-align:right;font-size:4rem;font-weight:900;font-style:italic;line-height:.85;text-shadow:0 4px 10px #000}
#spd small{font-size:1.1rem;color:#aaa;font-weight:400}
#nit{position:absolute;bottom:36px;left:36px;width:280px;height:12px;background:rgba(0,0,0,.6);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.3)}
#nb{height:100%;width:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
#cd{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:8rem;font-weight:900;font-style:italic;text-shadow:0 10px 30px #000;z-index:60;pointer-events:none}
#mc{position:absolute;bottom:0;left:0;width:100%;height:190px;z-index:999;pointer-events:none}
.cb{position:absolute;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);display:flex;justify-content:center;align-items:center;font-size:26px;pointer-events:auto}
.cb.a{background:rgba(255,255,255,.7)}
@media(max-width:768px){
h1{font-size:2.2rem}.grid{grid-template-columns:repeat(2,1fr)}
.ct{flex-direction:column;overflow-y:auto;padding-bottom:96px}.vp{flex:none;min-height:210px}.pn{overflow:visible}
#spd{bottom:130px;right:16px;font-size:3rem}#nit{top:18px;right:16px;left:auto;bottom:auto;width:140px}#info{top:16px;left:16px}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="cv"></canvas>

<div id="menu" class="ov">
  <h1>Neon Horizon</h1><h2>SELECT TRACK</h2>
  <div class="grid" id="tracks"></div>
  <div id="err"></div>
</div>

<div id="lobby" class="ov" style="display:none">
  <button id="back" class="fx" onclick="changeState('MENU')">◀ BACK</button>
  <button id="go" class="fx" onclick="startRace()">RACE NOW ▶</button>
  <div class="box">
    <div class="hd"><span>GARAGE / <span id="trk" style="color:#aaa"></span></span><b id="money">$0</b></div>
    <div class="ct">
      <div class="vp"></div>
      <div class="pn">
        <div class="sec"><h3>BODYWORK</h3><div class="row"><span>Paint Color</span><input type="color" id="pc"></div></div>
        <div class="sec"><h3>PERFORMANCE</h3>
          <div class="row"><div>Engine LVL <span id="eng-l"></span><div class="bar"><i id="eng-b"></i></div></div><button class="btn sm" id="eng-u" onclick="upgrade('eng',1000)"></button></div>
          <div class="row"><div>Handling LVL <span id="hnd-l"></span><div class="bar"><i id="hnd-b"></i></div></div><button class="btn sm" id="hnd-u" onclick="upgrade('hnd',800)"></button></div>
        </div>
        <div class="sec"><h3>WHEELS</h3>
          <div class="row"><span>Forged Red</span><button class="btn sm" data-w="0" onclick="setWheel(0)"></button></div>
          <div class="row"><span>Silver Alloy</span><button class="btn sm" data-w="1" onclick="setWheel(1)"></button></div>
          <div class="row"><span>Gold Mesh</span><button class="btn sm" data-w="2" onclick="setWheel(2)"></button></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="hud" style="display:none">
  <div id="info">LAP <span id="lap">1/3</span><br>POS <span id="pos">1/11</span></div>
  <div id="spd"><span id="sv">0</span><br><small>KM/H</small></div>
  <div id="nit"><div id="nb"></div></div>
</div>
<div id="cd" style="display:none"></div>
<div id="mc" style="display:none">
  <div class="cb" id="b-a" style="bottom:20px;left:16px">◀</div>
  <div class="cb" id="b-d" style="bottom:20px;left:102px">▶</div>
  <div class="cb" id="b-s" style="bottom:20px;right:112px">▼</div>
  <div class="cb" id="b-w" style="bottom:20px;right:16px;width:82px;height:82px;background:rgba(255,60,60,.4)">▲</div>
  <div class="cb" id="b-sp" style="bottom:112px;right:20px;width:60px;height:60px;font-size:15px;font-weight:700;background:rgba(0,242,254,.4)">N2O</div>
</div>

<div id="result" class="ov" style="display:none">
  <h1 style="font-size:3.5rem">FINISH</h1>
  <h2 id="rpos" style="font-size:2.6rem;color:#fff;margin:8px">1ST PLACE</h2>
  <h3 id="rprize" style="color:var(--ac2);font-weight:300;margin:0 0 30px">PRIZE</h3>
  <button class="btn" style="background:var(--ac);color:#000" onclick="changeState('MENU')">CONTINUE</button>
</div>

<script>
const $=id=>document.getElementById(id), V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const TW=34, N=400, LAPS=3;
let save={money:0,eng:1,hnd:1,color:'#cc2222',wheel:0};
try{Object.assign(save,JSON.parse(localStorage.getItem('nh_save')||'{}'))}catch(e){}
function persist(){try{localStorage.setItem('nh_save',JSON.stringify(save))}catch(e){}}

let renderer,scene,camera,clock,state='MENU',level=1,trackGroup=null,curve,len=1;
let P=[],T=[],NR=[],SLOW=[],ai=[],pcar=null,cdTimer=null,frame=0,lobbyAng=0;
let pPos=V3(0,0,0),pVel=0,pAng=0,pSteer=0,pNit=100,pLaps=0,pT=0.98,pTop=false,fov=65;
const keys={w:0,a:0,s:0,d:0,sp:0};

// ---------- tracks (generated, 10 variants) ----------
for(let i=1;i<=10;i++){const b=document.createElement('button');b.className='btn';b.textContent='TRACK '+i;b.onclick=()=>startGame(i);$('tracks').appendChild(b)}

// ---------- input ----------
const KM={KeyW:'w',ArrowUp:'w',KeyS:'s',ArrowDown:'s',KeyA:'a',ArrowLeft:'a',KeyD:'d',ArrowRight:'d',Space:'sp'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){keys[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){keys[k]=0;e.preventDefault()}});
[['b-a','a'],['b-d','d'],['b-s','s'],['b-w','w'],['b-sp','sp']].forEach(([id,k])=>{
  const el=$(id),on=e=>{e.preventDefault();keys[k]=1;el.classList.add('a')},off=e=>{e.preventDefault();keys[k]=0;el.classList.remove('a')};
  el.addEventListener('touchstart',on,{passive:false});el.addEventListener('touchend',off,{passive:false});el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('mousedown',on);addEventListener('mouseup',()=>{keys[k]=0;el.classList.remove('a')});
});
const isTouch=()=>('ontouchstart' in window)||navigator.maxTouchPoints>0;

// ---------- engine ----------
function initEngine(){
  if(renderer)return;
  if(typeof THREE==='undefined')throw new Error('โหลด Three.js ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต');
  renderer=new THREE.WebGLRenderer({canvas:$('cv'),antialias:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.5,2500);
  scene.add(new THREE.AmbientLight(0xffffff,.75));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(100,150,60);scene.add(dl);
  clock=new THREE.Clock();
  addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;lobbyView();});
  animate();
}
function lobbyView(){
  if(state==='LOBBY'){const w=innerWidth,h=innerHeight,m=w<=768;camera.setViewOffset(w,h,m?0:w*.2,m?h*.3:0,w,h)}
  else camera.clearViewOffset();
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
}

// ---------- track ----------
function makeCurve(l){
  const s=300+l*25,n=36,k=l%4,ph=l*1.3,pts=[];
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2;let x,z;
    if(k===1){const r=s*(1+.4*Math.sin(2*a));x=Math.cos(a)*r;z=Math.sin(a)*r*.6}
    else if(k===2){x=Math.cos(a)*s*1.1;z=Math.sin(a)*s*(1+.3*Math.cos(a))}
    else if(k===3){x=Math.cos(a)*s*1.6;z=Math.sin(a)*s*.7}
    else{const r=s*(1-.3*Math.cos(a));x=Math.cos(a)*r;z=Math.sin(a)*r+100}
    const w=1+.07*Math.sin(3*a+ph);pts.push(V3(x*w,0,z*w));
  }
  return new THREE.CatmullRomCurve3(pts,true,'centripetal');
}
function ribbon(o1,o2,y,col){
  const pos=[],c=[],idx=[];let v=0;
  for(let i=0;i<N;i++){
    const j=(i+1)%N,cl=col(i);if(!cl)continue;
    [[i,o1],[i,o2],[j,o1],[j,o2]].forEach(([q,o])=>{pos.push(P[q].x+NR[q].x*o,y,P[q].z+NR[q].z*o);c.push(cl[0],cl[1],cl[2])});
    idx.push(v,v+1,v+2,v+1,v+3,v+2);v+=4;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));g.setIndex(idx);
  return new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide}));
}
function buildTrack(){
  if(trackGroup){scene.remove(trackGroup);trackGroup.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
  trackGroup=new THREE.Group();scene.add(trackGroup);
  curve=makeCurve(level);len=curve.getLength();P=[];T=[];NR=[];
  for(let i=0;i<N;i++){
    P.push(curve.getPointAt(i/N));const t=curve.getTangentAt(i/N);t.y=0;t.normalize();T.push(t);NR.push(V3(-t.z,0,t.x));
  }
  SLOW=T.map((t,i)=>{const u=T[(i+10)%N];const d=Math.acos(Math.max(-1,Math.min(1,t.dot(u))));return 1-Math.min(.3,d*1.5)});
  const sky=[0x88ccff,0xff9a55,0x0a0a2a][level%3];scene.background=new THREE.Color(sky);scene.fog=new THREE.Fog(sky,300,1400);
  const gr=new THREE.Mesh(new THREE.PlaneGeometry(5000,5000),new THREE.MeshBasicMaterial({color:level%3===2?0x0a160a:0x1f4a1f}));
  gr.rotation.x=-Math.PI/2;gr.position.y=-.2;trackGroup.add(gr);
  trackGroup.add(ribbon(-TW/2,TW/2,.05,i=>i%6<3?[.2,.2,.22]:[.23,.23,.25]));
  const kc=i=>i%4<2?[.85,.1,.1]:[.95,.95,.95];
  trackGroup.add(ribbon(TW/2,TW/2+2.2,.1,kc));trackGroup.add(ribbon(-TW/2-2.2,-TW/2,.1,kc));
  trackGroup.add(ribbon(-.4,.4,.12,i=>i%6<3?[.9,.9,.9]:null));
  // barriers
  const B=Math.ceil(len/5.5),bg=new THREE.BoxGeometry(2,2.4,6),bm=new THREE.MeshLambertMaterial({color:0xffffff});
  const L=new THREE.InstancedMesh(bg,bm,B),R=new THREE.InstancedMesh(bg,bm,B),d=new THREE.Object3D(),cr=new THREE.Color(0xaa1111),cw=new THREE.Color(0xeeeeee);
  for(let j=0;j<B;j++){
    const t=j/B,p=curve.getPointAt(t),tg=curve.getTangentAt(t);tg.y=0;tg.normalize();const n=V3(-tg.z,0,tg.x),c=j%2?cr:cw;
    [[L,1],[R,-1]].forEach(([m,s])=>{d.position.copy(p).addScaledVector(n,s*(TW/2+3.4));d.position.y=1.2;d.lookAt(d.position.clone().add(tg));d.updateMatrix();m.setMatrixAt(j,d.matrix);m.setColorAt(j,c)});
  }
  trackGroup.add(L,R);
  // start gantry
  const g=new THREE.Group(),dm=new THREE.MeshLambertMaterial({color:0x222222});
  [-1,1].forEach(s=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,15),dm);p.position.set(s*(TW/2+3),7.5,0);g.add(p)});
  const sg=new THREE.Mesh(new THREE.BoxGeometry(TW+8,3,1),new THREE.MeshBasicMaterial({color:0xaa0000}));sg.position.y=13.5;g.add(sg);
  const sl=new THREE.Mesh(new THREE.PlaneGeometry(TW,3),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));sl.rotation.x=-Math.PI/2;sl.position.y=.14;g.add(sl);
  g.position.copy(P[0]);g.lookAt(P[0].clone().add(T[0]));trackGroup.add(g);
}
function sample(prog,lane){
  const f=((prog%1)+1)%1*N,i=Math.floor(f)%N,j=(i+1)%N,u=f-Math.floor(f);
  const p=P[i].clone().lerp(P[j],u),t=T[i].clone().lerp(T[j],u).normalize();
  p.x+=-t.z*lane;p.z+=t.x*lane;p.y=.05;return{p,a:Math.atan2(t.x,t.z)};
}

// ---------- car ----------
function buildCar(color,wheel){
  const g=new THREE.Group(),ch=new THREE.Group();g.add(ch);
  const M=c=>new THREE.MeshLambertMaterial({color:c}),body=M(color),dark=M(0x151515),red=new THREE.MeshBasicMaterial({color:0xff2222});
  const box=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);ch.add(o)};
  box(2.3,.5,4.5,body,0,.55,0);box(1.5,.45,1.8,M(0x0a0a14),0,1,-.2);box(2.4,.05,.8,dark,0,.3,2.2);box(2.45,.03,.1,red,0,.32,2.55);
  box(2.5,.4,1,dark,0,.6,-1);box(2.6,.06,.6,dark,0,1.25,-2.1);box(.08,.5,.2,dark,-.8,.95,-2);box(.08,.5,.2,dark,.8,.95,-2);
  const rc=[0xcc1111,0xdddddd,0xd4af37][wheel]||0xcc1111,ws=[];
  [[-1.2,1.5],[1.2,1.5],[-1.2,-1.4],[1.2,-1.4]].forEach((p,i)=>{
    const s=new THREE.Group(),r=new THREE.Group();s.position.set(p[0],.35,p[1]);
    const tire=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.3,14),dark),rim=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.34,10),M(rc));
    tire.rotation.z=rim.rotation.z=Math.PI/2;
    const bar=new THREE.Mesh(new THREE.BoxGeometry(.36,.46,.06),dark);
    r.add(tire,rim,bar);s.add(r);g.add(s);ws.push({s,r,f:i<2});
  });
  return{g,ch,ws};
}
function rebuildPlayer(){
  if(!scene)return;if(pcar)scene.remove(pcar.g);
  pcar=buildCar(parseInt(save.color.slice(1),16),save.wheel);scene.add(pcar.g);pcar.g.position.copy(pPos);pcar.g.rotation.y=pAng;
}

// ---------- level setup ----------
function buildLevel(){
  buildTrack();
  ai.forEach(a=>scene.remove(a.car.g));ai=[];
  const slots=[];for(let k=0;k<11;k++)slots.push({d:8+Math.floor(k/2)*9,lane:(k%2?1:-1)*6});
  const PS=6;
  slots.forEach((s,k)=>{
    const prog=1-s.d/len,sm=sample(prog,s.lane);
    if(k===PS){pPos.copy(sm.p);pAng=sm.a;pVel=0;pSteer=0;pNit=100;pLaps=0;pT=Math.floor(prog*N)/N;return}
    const car=buildCar(new THREE.Color().setHSL(Math.random(),.9,.5).getHex(),Math.floor(Math.random()*3));scene.add(car.g);
    car.g.position.copy(sm.p);car.g.rotation.y=sm.a;
    ai.push({car,prog,laps:0,vel:0,f:.82+Math.random()*.15,lane:s.lane,tl:s.lane,tm:0});
  });
  rebuildPlayer();
}
function updateAI(dt){
  ai.forEach(a=>{
    a.tm-=dt;if(a.tm<=0){a.tl=(Math.random()-.5)*20;a.tm=3+Math.random()*4}
    a.lane+=(a.tl-a.lane)*Math.min(1,dt*.8);
    const tgt=66*a.f*SLOW[Math.floor(a.prog*N)%N];a.vel+=(tgt-a.vel)*Math.min(1,dt*.7);
    a.prog+=a.vel*dt/len;if(a.prog>=1){a.prog-=1;a.laps++}
    const s=sample(a.prog,a.lane);a.car.g.position.copy(s.p);a.car.g.rotation.y=s.a;
    a.car.ws.forEach(w=>{w.r.rotation.x+=a.vel*dt});
  });
}
function place(){const me=pLaps+pT;let r=1;ai.forEach(a=>{if(a.laps+a.prog>me)r++});return r}

// ---------- UI ----------
function updateUI(){
  $('money').textContent='$'+save.money;$('trk').textContent='TRACK '+level;$('pc').value=save.color;
  [['eng',1000],['hnd',800]].forEach(([k,c])=>{const l=save[k];$(k+'-l').textContent=l;$(k+'-b').style.width=l*20+'%';const b=$(k+'-u');b.textContent=l>=5?'MAX':'$'+l*c;b.disabled=l>=5});
  document.querySelectorAll('[data-w]').forEach(b=>{const on=+b.dataset.w===save.wheel;b.textContent=on?'Equipped':'Equip';b.classList.toggle('on',on)});
}
function upgrade(k,c){const l=save[k];if(l<5&&save.money>=l*c){save.money-=l*c;save[k]++;persist();updateUI()}}
function setWheel(i){save.wheel=i;persist();updateUI();rebuildPlayer()}
$('pc').addEventListener('input',e=>{save.color=e.target.value;persist();rebuildPlayer()});

function changeState(s){
  state=s;clearInterval(cdTimer);
  ['menu','lobby','result'].forEach(id=>$(id).style.display='none');
  ['hud','cd','mc'].forEach(id=>$(id).style.display='none');
  if(s==='MENU')$('menu').style.display='flex';
  else if(s==='LOBBY'){updateUI();$('lobby').style.display='flex'}
  else if(s==='COUNTDOWN'||s==='RACING'){$('hud').style.display='block';if(isTouch())$('mc').style.display='block';if(s==='COUNTDOWN')countdown()}
  else if(s==='FINISHED'){$('hud').style.display='block';$('result').style.display='flex'}
  lobbyView();
}
function startGame(l){
  $('err').textContent='';
  try{initEngine();level=l;buildLevel();changeState('LOBBY')}
  catch(e){console.error(e);$('err').textContent='❌ '+e.message;changeState('MENU')}
}
function startRace(){changeState('COUNTDOWN')}
function countdown(){
  const cd=$('cd');cd.style.display='block';cd.style.color='#fff';let n=3;cd.textContent=n;
  cdTimer=setInterval(()=>{
    n--;
    if(n>0)cd.textContent=n;
    else if(n===0){cd.textContent='GO!';cd.style.color='#00f2fe';state='RACING'}
    else{cd.style.display='none';clearInterval(cdTimer)}
  },1000);
}
function finish(){
  state='FINISHED';const p=place(),prize=[0,1000,600,300][p]||100;save.money+=prize;persist();
  const sfx=p===1?'ST':p===2?'ND':p===3?'RD':'TH';
  $('rpos').textContent=p+sfx+' PLACE';$('rpos').style.color=p===1?'gold':p<=3?'silver':'#fff';
  $('rprize').textContent='PRIZE: $'+prize;changeState2();
}
function changeState2(){$('result').style.display='flex'}

// ---------- loop ----------
function animate(){
  requestAnimationFrame(animate);
  let dt=clock.getDelta();if(dt>.05)dt=.05;
  if(state==='MENU'){return}
  if(state==='LOBBY'&&pcar){
    lobbyAng+=.5*dt;camera.position.set(pPos.x+Math.sin(lobbyAng)*9,pPos.y+2.6,pPos.z+Math.cos(lobbyAng)*9);camera.lookAt(pPos.x,.6,pPos.z);
  }else if(state==='COUNTDOWN'||state==='RACING'||state==='FINISHED'){
    const maxS=70+save.eng*5,acc=30+save.eng*3,hnd=1.8+save.hnd*.25;
    if(state==='RACING'){
      if(keys.w)pVel+=acc*dt;else if(keys.s)pVel-=60*dt;else pVel-=Math.sign(pVel)*Math.min(Math.abs(pVel),15*dt);
      const nit=keys.sp&&pNit>0;
      if(nit){pVel+=40*dt;pNit-=25*dt}else if(pNit<100)pNit+=4*dt;
      fov+=((nit?82:65)-fov)*.1;camera.fov=fov;camera.updateProjectionMatrix();
      const mx=nit?maxS+30:maxS;if(pVel>mx)pVel-=60*dt;if(pVel<-20)pVel=-20;
      if(keys.a)pSteer+=hnd*dt*2;if(keys.d)pSteer-=hnd*dt*2;
      if(!keys.a&&!keys.d)pSteer*=Math.exp(-12*dt);
      pSteer=Math.max(-1.5,Math.min(1.5,pSteer));
      if(Math.abs(pVel)>1)pAng+=pSteer*(pVel>0?1:-1)*Math.min(1,Math.abs(pVel)/maxS)*dt;
    }else if(state==='FINISHED'){pVel*=Math.exp(-1.2*dt);pSteer*=.9}
    pPos.x+=Math.sin(pAng)*pVel*dt;pPos.z+=Math.cos(pAng)*pVel*dt;pPos.y=.05;
    // nearest sample, off-track handling, lap progress
    let bi=0,bd=1e18;for(let i=0;i<N;i++){const dx=P[i].x-pPos.x,dz=P[i].z-pPos.z,d=dx*dx+dz*dz;if(d<bd){bd=d;bi=i}}
    const lat=(pPos.x-P[bi].x)*NR[bi].x+(pPos.z-P[bi].z)*NR[bi].z,lim=TW/2+1.2;
    if(Math.abs(lat)>TW/2+2.2)pVel*=Math.exp(-.9*dt);
    if(Math.abs(lat)>lim){const ex=lat-Math.sign(lat)*lim;pPos.x-=NR[bi].x*ex;pPos.z-=NR[bi].z*ex;pVel*=Math.exp(-3*dt)}
    const t=bi/N;
    if(pT>.75&&t<.25)pLaps++;else if(pT<.25&&t>.75)pLaps--;
    pT=t;
    if(state==='RACING'&&pLaps>=LAPS+1)finish();
    if(state!=='COUNTDOWN')updateAI(dt);
    if(pcar){
      pcar.g.position.copy(pPos);pcar.g.rotation.y=pAng;
      pcar.ch.rotation.z=-pSteer*(Math.abs(pVel)/maxS)*.25;pcar.ch.rotation.x=keys.w?-.02:keys.s?.04:0;
      pcar.ws.forEach(w=>{w.r.rotation.x+=pVel*dt;if(w.f)w.s.rotation.y=pSteer*.5});
    }
    const off=V3(0,3,-7.5).applyAxisAngle(V3(0,1,0),pAng),look=V3(0,1.2,10).applyAxisAngle(V3(0,1,0),pAng);
    camera.position.lerp(pPos.clone().add(off),1-Math.exp(-9*dt));camera.lookAt(pPos.clone().add(look));
    $('sv').textContent=Math.abs(Math.floor(pVel*2.5));$('nb').style.width=Math.max(0,pNit)+'%';
    $('lap').textContent=Math.max(1,Math.min(pLaps,LAPS))+'/'+LAPS;
    if(++frame%10===0)$('pos').textContent=place()+'/11';
  }
  renderer.render(scene,camera);
}
